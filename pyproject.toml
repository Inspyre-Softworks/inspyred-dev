[build-system]
requires = ['hatchling>=1.26']
build-backend = 'hatchling.build'

[project]
name = 'inspyred-dev'
dynamic = ['version']
description = 'Capture developer observations and turn them into actionable work.'
readme = 'README.md'
requires-python = '>=3.13'
license = { text = 'MIT' }
authors = [
  { name = 'Taylor B. | Inspyre-Softworks.' }
]
dependencies = [
  'PySide6>=6.8',
  'keyring>=25.5',
  'platformdirs>=4.3',
  'pydantic>=2.9',
]

[project.optional-dependencies]
dev = [
  'pytest>=8.3',
  'pytest-cov>=6.0',
  'ruff>=0.8',
  'mypy>=1.13',
  'pyinstaller>=6.11',
]
docs = [
  'furo>=2024.8.6',
  'sphinx>=8.1',
]

[project.scripts]
inspyred-dev = 'inspyred_dev.__main__:main'

[tool.hatch.build.targets.wheel]
packages = ['src/inspyred_dev']

[tool.hatch.version]
path = 'src/inspyred_dev/__init__.py'

[tool.ruff]
line-length = 100
target-version = 'py313'

[tool.ruff.lint]
select = ['D', 'E4', 'E7', 'E9', 'F']

[tool.ruff.lint.pydocstyle]
convention = 'numpy'

[tool.ruff.format]
quote-style = 'single'

[tool.pytest.ini_options]
testpaths = ['tests']
pythonpath = ['src']
