name: Build Python Package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - run: python -m pip install --upgrade build
      - run: python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*
