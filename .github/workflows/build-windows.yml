name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Test
        run: python -m pytest -q

      - name: Build application
        run: python -m PyInstaller --clean --noconfirm packaging/InspyredDev.spec

      - name: Archive bundle
        shell: pwsh
        run: Compress-Archive -Path dist/InspyredDev/* -DestinationPath InspyredDev-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: InspyredDev-windows-x64
          path: InspyredDev-windows-x64.zip
